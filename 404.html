<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nicole & Pablo</title>
<script>
(function(){
  var path=window.location.pathname.replace(/\/+$/,'');
  var parts=path.split('/').filter(Boolean);
  var codigo=parts.length>=2 ? parts[parts.length-1] : '';
  if(codigo && codigo.toLowerCase()!=='index.html'){
    var base='/'+parts[0]+'/';
    window.location.replace(base+'?codigo='+encodeURIComponent(decodeURIComponent(codigo)));
  }else{
    window.location.replace('/NicoleyPablo/');
  }
})();
</script>
</head>
<body></body>
</html>
